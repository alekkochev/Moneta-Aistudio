<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Outer Ring Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E6EB" stop-opacity="0.4"/>
    </radialGradient>
    
    <!-- Text Paths for Circular Text -->
    <path id="textPathTop" d="M 68 250 A 182 182 0 1 1 432 250" fill="none"/>
    <path id="textPathBottom" d="M 432 250 A 182 182 0 1 1 68 250" fill="none"/>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EC1752" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="235" fill="none" filter="url(#shadow)"/>

  <!-- Main Color Ring -->
  <circle cx="250" cy="250" r="235" fill="#EC1752" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Circular Text Top & Bottom -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      MONETA THERMO SYSTEM
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MONETA THERMO SYSTEM
    </textPath>
  </text>

  <!-- Inner Circle Canvas -->
  <circle cx="250" cy="250" r="162" fill="url(#bgGrad)" stroke="#EC1752" stroke-width="3"/>
  <circle cx="250" cy="250" r="162" fill="url(#innerGlow)"/>

  <!-- Center Graphic & Moneta Branding -->
  <g transform="translate(0,0)">
    
    <!-- Thermo Winter Insole -->
    <path d="M 140 215 Q 220 195 360 220 Q 365 235 340 245 Q 220 250 145 230 Z" fill="#D4E157" stroke="#AFB42B" stroke-width="2.5"/>
    <!-- Snowflakes -->
    <g stroke="#00B0FF" stroke-width="2.5" stroke-linecap="round">
      <path d="M 170 175 L 170 189 M 163 182 L 177 182 M 165 177 L 175 187 M 165 187 L 175 177"/>
      <path d="M 230 185 L 230 199 M 223 192 L 237 192 M 225 187 L 235 197 M 225 197 L 235 187"/>
      <path d="M 290 190 L 290 204 M 283 197 L 297 197 M 285 192 L 295 202 M 285 202 L 295 192"/>
    </g>
    <!-- Upward Heat Arrows -->
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 180 252 L 180 230 M 174 236 L 180 229 L 186 236"/>
      <path d="M 235 254 L 235 232 M 229 238 L 235 231 L 241 238"/>
      <path d="M 285 256 L 285 234 M 279 240 L 285 233 L 291 240"/>
    </g>
  
  </g>

  <!-- MONETA Logo Text in center -->
  <g transform="translate(250, 275)" filter="url(#shadow)">
    <text x="0" y="0" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="34" fill="#EC1752" text-anchor="middle" letter-spacing="-1">moneta<tspan font-size="16" dy="-14">®</tspan></text>
  </g>
</svg>