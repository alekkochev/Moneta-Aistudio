<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Outer Ring Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E6EB" stop-opacity="0.4"/>
    </radialGradient>
    
    <!-- Text Paths for Circular Text -->
    <path id="textPathTop" d="M 68 250 A 182 182 0 1 1 432 250" fill="none"/>
    <path id="textPathBottom" d="M 432 250 A 182 182 0 1 1 68 250" fill="none"/>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A4A4A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="235" fill="none" filter="url(#shadow)"/>

  <!-- Main Color Ring -->
  <circle cx="250" cy="250" r="235" fill="#4A4A4A" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Circular Text Top & Bottom -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      MONETA MEMORY SYSTEM
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MONETA MEMORY SYSTEM
    </textPath>
  </text>

  <!-- Inner Circle Canvas -->
  <circle cx="250" cy="250" r="162" fill="url(#bgGrad)" stroke="#4A4A4A" stroke-width="3"/>
  <circle cx="250" cy="250" r="162" fill="url(#innerGlow)"/>

  <!-- Center Graphic & Moneta Branding -->
  <g transform="translate(0,0)">
    
    <!-- Memory Foam Insole -->
    <path d="M 140 215 C 190 190 280 195 365 220 C 375 235 350 248 290 250 C 210 252 145 242 140 215 Z" fill="#EAEAEA" stroke="#BBBBBB" stroke-width="3"/>
    <!-- Heel and Toe Impressions -->
    <ellipse cx="170" cy="224" rx="20" ry="10" fill="#D2D2D2" opacity="0.8"/>
    <ellipse cx="320" cy="226" rx="32" ry="12" fill="#D2D2D2" opacity="0.8"/>
    <ellipse cx="240" cy="223" rx="45" ry="9" fill="#DDDDDD" opacity="0.9"/>
    <!-- Subtle contour lines -->
    <path d="M 155 222 Q 240 210 345 224" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
  
  </g>

  <!-- MONETA Logo Text in center -->
  <g transform="translate(250, 275)" filter="url(#shadow)">
    <text x="0" y="0" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="34" fill="#EC1752" text-anchor="middle" letter-spacing="-1">moneta<tspan font-size="16" dy="-14">®</tspan></text>
  </g>
</svg>