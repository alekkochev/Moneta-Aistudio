<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Outer Ring Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E6EB" stop-opacity="0.4"/>
    </radialGradient>
    
    <!-- Text Paths for Circular Text -->
    <path id="textPathTop" d="M 68 250 A 182 182 0 1 1 432 250" fill="none"/>
    <path id="textPathBottom" d="M 432 250 A 182 182 0 1 1 68 250" fill="none"/>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#363636" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="235" fill="none" filter="url(#shadow)"/>

  <!-- Main Color Ring -->
  <circle cx="250" cy="250" r="235" fill="#363636" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Circular Text Top & Bottom -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      MONETA ORTHO SYSTEM
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MONETA ORTHO SYSTEM
    </textPath>
  </text>

  <!-- Inner Circle Canvas -->
  <circle cx="250" cy="250" r="162" fill="url(#bgGrad)" stroke="#363636" stroke-width="3"/>
  <circle cx="250" cy="250" r="162" fill="url(#innerGlow)"/>

  <!-- Center Graphic & Moneta Branding -->
  <g transform="translate(0,0)">
    
    <!-- Foot Bones / Anatomic Ortho Silhouette -->
    <path d="M 155 240 Q 185 130 225 125 C 240 125 245 150 250 185 Q 285 225 355 238 C 365 240 360 250 335 255 Q 240 260 155 240 Z" fill="#E6ECF2" opacity="0.85" stroke="#BDC9D6" stroke-width="2"/>
    <!-- Red Ortho Spine & Heel Pain Points -->
    <circle cx="185" cy="238" r="18" fill="#EC1752" opacity="0.3"/>
    <circle cx="185" cy="238" r="9" fill="#EC1752"/>
    <!-- Bone lines -->
    <path d="M 220 135 L 225 200 M 235 140 L 240 205 M 200 235 C 230 220 280 230 330 242" stroke="#EC1752" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  </g>

  <!-- MONETA Logo Text in center -->
  <g transform="translate(250, 275)" filter="url(#shadow)">
    <text x="0" y="0" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="34" fill="#EC1752" text-anchor="middle" letter-spacing="-1">moneta<tspan font-size="16" dy="-14">®</tspan></text>
  </g>
</svg>