<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient for Silver Inner Disc -->
    <radialGradient id="silverGradient" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#D4D8DE"/>
      <stop offset="100%" stop-color="#9AA1A9"/>
    </radialGradient>
    
    <!-- Insole Gradient -->
    <linearGradient id="insoleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D732"/>
      <stop offset="100%" stop-color="#83A600"/>
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C3FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>

    <!-- Arc Path for Text along top circle (180deg curve inside green ring) -->
    <path id="textArcTop" d="M 62,250 A 188,188 0 1,1 438,250" fill="none"/>

    <!-- Subtle Drop Shadow -->
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="235" fill="none" filter="url(#sealShadow)"/>

  <!-- Outer Lime-Green Ring -->
  <circle cx="250" cy="250" r="235" fill="#9BC31C" stroke="#7A9E00" stroke-width="2"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#7A9E00" stroke-width="2.5"/>

  <!-- Curved Text "MONETA ABSORB & BREATHABLE SYSTEM" -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="3.5">
    <textPath xlink:href="#textArcTop" href="#textArcTop" startOffset="50%" text-anchor="middle">
      MONETA ABSORB &amp; BREATHABLE SYSTEM
    </textPath>
  </text>

  <!-- Inner Silver Circular Plate -->
  <circle cx="250" cy="250" r="162" fill="url(#silverGradient)" stroke="#82A300" stroke-width="3"/>
  <circle cx="250" cy="250" r="158" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

  <!-- CENTER LOGO: "moneta®" in Red/Magenta -->
  <g transform="translate(250, 182)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#EC1752" text-anchor="middle" letter-spacing="-1.5">
      moneta<tspan font-size="20" dy="-20">®</tspan>
    </text>
  </g>

  <!-- CENTER GRAPHIC: Insole, Water Drops & Downward Arrows -->
  <!-- 3D Insole Silhouette -->
  <g transform="translate(0, 15)">
    <!-- Insole Base Shadow -->
    <path d="M 135,248 Q 230,215 370,248 Q 365,268 335,278 Q 230,285 140,265 Z" fill="#5F6670" opacity="0.4"/>
    <!-- Insole Main Body -->
    <path d="M 132,240 C 180,210 280,205 368,240 C 375,255 350,270 325,278 C 240,288 160,275 132,255 C 125,248 126,242 132,240 Z" fill="url(#insoleGrad)" stroke="#6A8700" stroke-width="2"/>
    <path d="M 142,242 C 190,218 280,212 358,242" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>

    <!-- 5 Blue Water Droplets Falling onto Insole -->
    <g fill="url(#dropGrad)" stroke="#004D99" stroke-width="1">
      <!-- Drop 1 -->
      <path d="M 160,202 C 160,192 170,180 170,180 C 170,180 180,192 180,202 C 180,208 175,212 170,212 C 165,212 160,208 160,202 Z"/>
      <!-- Drop 2 -->
      <path d="M 205,212 C 205,202 215,190 215,190 C 215,190 225,202 225,212 C 225,218 220,222 215,222 C 210,222 205,218 205,212 Z"/>
      <!-- Drop 3 -->
      <path d="M 248,220 C 248,210 258,198 258,198 C 258,198 268,210 268,220 C 268,226 263,230 258,230 C 253,230 248,226 248,220 Z"/>
      <!-- Drop 4 -->
      <path d="M 292,228 C 292,218 302,206 302,206 C 302,206 312,218 312,228 C 312,234 307,238 302,238 C 297,238 292,234 292,228 Z"/>
      <!-- Drop 5 -->
      <path d="M 332,238 C 332,228 340,218 340,218 C 340,218 348,228 348,238 C 348,243 344,247 340,247 C 336,247 332,243 332,238 Z"/>
    </g>

    <!-- White Downward Arrows passing through Insole -->
    <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#sealShadow)">
      <!-- Arrow 1 -->
      <path d="M 158,268 L 158,292 M 150,284 L 158,293 L 166,284"/>
      <!-- Arrow 2 -->
      <path d="M 208,278 L 208,305 M 200,297 L 208,306 L 216,297"/>
      <!-- Arrow 3 -->
      <path d="M 258,284 L 258,312 M 250,304 L 258,313 L 266,304"/>
      <!-- Arrow 4 -->
      <path d="M 305,282 L 305,308 M 297,300 L 305,309 L 313,300"/>
    </g>
  </g>
</svg>
