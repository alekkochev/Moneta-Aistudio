<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Outer Ring Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F3F5"/>
      <stop offset="100%" stop-color="#DCE0E6"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E6EB" stop-opacity="0.4"/>
    </radialGradient>
    
    <!-- Text Paths for Circular Text -->
    <path id="textPathTop" d="M 68 250 A 182 182 0 1 1 432 250" fill="none"/>
    <path id="textPathBottom" d="M 432 250 A 182 182 0 1 1 68 250" fill="none"/>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8DB600" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="235" fill="none" filter="url(#shadow)"/>

  <!-- Main Color Ring -->
  <circle cx="250" cy="250" r="235" fill="#8DB600" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Circular Text Top & Bottom -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      MONETA ABSORB & BREATHABLE SYSTEM
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MONETA ABSORB & BREATHABLE SYSTEM
    </textPath>
  </text>

  <!-- Inner Circle Canvas -->
  <circle cx="250" cy="250" r="162" fill="url(#bgGrad)" stroke="#8DB600" stroke-width="3"/>
  <circle cx="250" cy="250" r="162" fill="url(#innerGlow)"/>

  <!-- Center Graphic & Moneta Branding -->
  <g transform="translate(0,0)">
    
    <!-- Insole shape -->
    <path d="M 140 215 Q 220 195 360 220 Q 365 235 340 245 Q 220 250 145 230 Z" fill="#B5D334" stroke="#7A9E00" stroke-width="2.5"/>
    <!-- Water Drops -->
    <g fill="#00A8FF" stroke="#0077CC" stroke-width="1.5">
      <path d="M 175 180 C 175 172 183 162 183 162 C 183 162 191 172 191 180 C 191 185 187 189 183 189 C 179 189 175 185 175 180 Z"/>
      <path d="M 225 190 C 225 182 233 172 233 172 C 233 172 241 182 241 190 C 241 195 237 199 233 199 C 229 199 225 195 225 190 Z"/>
      <path d="M 280 195 C 280 187 288 177 288 177 C 288 177 296 187 296 195 C 296 200 292 204 288 204 C 284 204 280 200 280 195 Z"/>
      <path d="M 325 200 C 325 193 331 184 331 184 C 331 184 337 193 337 200 C 337 204 334 207 331 207 C 328 207 325 204 325 200 Z"/>
    </g>
    <!-- Downward Arrows -->
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 180 232 L 180 255 M 174 249 L 180 256 L 186 249"/>
      <path d="M 225 236 L 225 259 M 219 253 L 225 260 L 231 253"/>
      <path d="M 275 238 L 275 261 M 269 255 L 275 262 L 281 255"/>
      <path d="M 320 235 L 320 258 M 314 252 L 320 259 L 326 252"/>
    </g>
  
  </g>

  <!-- MONETA Logo Text in center -->
  <g transform="translate(250, 275)" filter="url(#shadow)">
    <text x="0" y="0" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="34" fill="#EC1752" text-anchor="middle" letter-spacing="-1">moneta<tspan font-size="16" dy="-14">®</tspan></text>
  </g>
</svg>